apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-flask
  template:
    metadata:
      labels:
        app: devops-flask
    spec:
      containers:
        - name: devops-flask-container
          image: ghcr.io/vikas-202/containerized-flask-application:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
